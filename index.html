<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazarbd Express - অনলাইন শপিং</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">Bazarbd Express</h1>
            <div class="flex space-x-3">
                <span class="text-sm">🔍</span>
                <span class="text-sm">🛒 (0)</span>
            </div>
        </div>
    </header>

    <!-- Welcome Banner -->
    <div class="m-4 rounded-xl overflow-hidden bg-gradient-to-r from-indigo-500 to-purple-600 p-6 text-white shadow-md">
        <h2 class="text-2xl font-bold">স্বাগতম!</h2>
        <p class="text-sm mt-2 opacity-90">Bazarbd Express-এ সেরা মানের পণ্য কিনুন সাশ্রয়ী মূল্যে।</p>
    </div>

    <!-- Product Section -->
    <section class="p-4">
        <h3 class="font-bold text-gray-800 mb-4 border-l-4 border-indigo-700 pl-2">নতুন কালেকশন</h3>
        
        <div class="grid grid-cols-2 gap-4">
            <!-- Item 1 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="h-32 bg-gray-200"></div>
                <div class="p-3">
                    <h4 class="text-xs font-semibold text-gray-700">প্রিমিয়াম গ্যাজেট</h4>
                    <p class="text-indigo-600 font-bold text-sm mt-1">৳ ১৫০০</p>
                    <button class="w-full mt-2 border border-indigo-600 text-indigo-600 text-[10px] py-1 rounded hover:bg-indigo-600 hover:text-white transition">অর্ডার করুন</button>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="h-32 bg-gray-200"></div>
                <div class="p-3">
                    <h4 class="text-xs font-semibold text-gray-700">ফ্যাশন আইটেম</h4>
                    <p class="text-indigo-600 font-bold text-sm mt-1">৳ ৯৫০</p>
                    <button class="w-full mt-2 border border-indigo-600 text-indigo-600 text-[10px] py-1 rounded hover:bg-indigo-600 hover:text-white transition">অর্ডার করুন</button>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
