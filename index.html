<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </title>BazarBD Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">

    <!-- প্রফেশনাল নেভিগেশন বার (দারাজের স্টাইলে) -->
    <nav class="bg-indigo-700 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold italic tracking-wider">BazarBD Express</h1>
            <div class="flex-1 mx-6 hidden md:block">
                <div class="relative">
                    <input type="text" placeholder="পণ্য খুঁজুন..." class="w-full p-2 rounded-lg text-black outline-none">
                    <button class="absolute right-2 top-2 text-gray-500"><i class="fas fa-search"></i></button>
                </div>
            </h1>
            <div class="flex gap-5 items-center">
                <i class="fas fa-shopping-cart text-xl"></i>
                <i class="fas fa-user-circle text-xl"></i>
            </div>
        </div>
    </nav>

    <!-- ব্যানার সেকশন -->
    <div class="m-4 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 p-8 text-white text-center shadow-xl">
        <h2 class="text-3xl font-bold mb-2">বিশাল অফার!</h2>
        <p class="opacity-90">আপনার প্রিয় পণ্য কিনুন সেরা দামে।</p>
    </div>

    <!-- প্রোডাক্ট ক্যাটাগরি এবং গ্রিড -->
    <section class="p-4 container mx-auto">
        <h3 class="text-xl font-bold mb-4 border-b-2 border-indigo-500 inline-block">সেরা গেজেট সমূহ</h3>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
            
            <!-- আইটেম ১ -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-2xl transition duration-300">
                <img src="https://images.unsplash.com/photo-1546868871-70c122467d9b?w=500" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h4 class="font-semibold text-gray-800">Smart Watch Series 8</h4>
                    <p class="text-indigo-600 font-bold text-lg mt-1">৳ ১৫০০</p>
                    <div class="flex text-yellow-400 text-xs my-2">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
                        <span class="text-gray-400 ml-1">(১২)</span>
                    </div>
                    <a href="https://wa.me/8801XXXXXXXXX?text=আমি Smart Watch Series 8 অর্ডার করতে চাই" 
                       class="w-full block text-center bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-bold transition">
                       অর্ডার করুন
                    </a>
                </div>
            </div>

            <!-- আইটেম ২ -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-2xl transition duration-300">
                <img src="https://images.unsplash.com/photo-1588423770503-d1d93ef33d5d?w=500" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h4 class="font-semibold text-gray-800">Wireless Airpods Pro</h4>
                    <p class="text-indigo-600 font-bold text-lg mt-1">৳ ৯৫০</p>
                    <div class="flex text-yellow-400 text-xs my-2">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i>
                        <span class="text-gray-400 ml-1">(৮)</span>
                    </div>
                    <a href="https://wa.me/8801317496029 text=আমি Wireless Airpods Pro অর্ডার করতে চাই" 
                       class="w-full block text-center bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-bold transition">
                       অর্ডার করুন
                    </a>
                </div>
            </div>

        </div>
    </section>

    <!-- ফুটার সেকশন -->
    <footer class="bg-gray-800 text-gray-400 p-8 mt-10 text-center">
        <p class="text-white font-bold">© ২০২৬ BazarBD Express </p>
        <div class="flex justify-center gap-4 mt-4">
            <i class="fab fa-facebook hover:text-white cursor-pointer"></i>
            <i class="fab fa-whatsapp hover:text-white cursor-pointer"></i>
            <i class="fab fa-instagram hover:text-white cursor-pointer"></i>
        </div>
    </footer>

</body>
</html>
