   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BazarBD Express | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        #main-app { display: none; }
        .auth-btn { transition: all 0.3s; border: 1px solid #ddd; }
        .auth-btn:hover { background-color: #f9f9f9; transform: scale(1.02); }
    </style>
</head>
<body class="bg-white">

    <div id="auth-screen" class="min-h-screen flex flex-col items-center px-6 pt-10">
        <h1 class="text-3xl font-black text-orange-600 mb-2 italic">BazarBD Express</h1>
        <p class="text-gray-500 text-center text-sm mb-10">Global sourcing with order protection & great savings</p>

        <img src="https://cdn-icons-png.flaticon.com/512/1162/1162456.png" class="w-40 mb-10 opacity-80">

        <div class="w-full max-w-sm space-y-3">
            <button onclick="loginLogic('Google')" class="auth-btn w-full flex items-center justify-center gap-3 py-3 rounded-full font-semibold text-gray-700">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5"> Continue with Google
            </button>

            <button onclick="loginLogic('Facebook')" class="auth-btn w-full flex items-center justify-center gap-3 py-3 rounded-full font-semibold text-gray-700">
                <i class="fab fa-facebook text-blue-600 text-xl"></i> Continue with Facebook
            </button>

            <div class="flex items-center gap-2 py-2">
                <div class="h-[1px] bg-gray-200 flex-1"></div>
                <span class="text-xs text-gray-400">OR</span>
                <div class="h-[1px] bg-gray-200 flex-1"></div>
            </div>

            <button onclick="loginLogic('Email')" class="auth-btn w-full flex items-center justify-center gap-3 py-3 rounded-full font-semibold text-gray-700">
                <i class="far fa-envelope text-xl"></i> Continue with email
            </button>
        </div>

        <p class="mt-10 text-gray-500 text-sm">Need help?</p>
    </div>

    <div id="main-app">
        <nav class="bg-orange-500 text-white p-4 sticky top-0 z-50 flex justify-between items-center">
            <h2 class="font-bold">BazarBD Express</h2>
            <i class="fas fa-shopping-basket"></i>
        </nav>

        <div class="p-4">
            <h3 class="font-bold text-lg mb-4">আপনার জন্য সেরা পণ্য</h3>
            
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-white border rounded-xl p-3 flex gap-4 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1546868871-70c122467d9b?w=200" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-bold">Smart Watch T800</h4>
                        <p class="text-orange-600 font-bold">৳ ১৫০০</p>
                        <a href="https://wa.me/8801317496029?text=আমি Smart Watch টি অর্ডার করতে চাই" class="inline-block mt-2 text-xs bg-black text-white px-4 py-2 rounded-full">অর্ডার দিন</a>
                    </div>
                </div>

                <div class="bg-white border rounded-xl p-3 flex gap-4 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1622322062681-3e49e29f0004?w=200" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-bold">Mini Portable Fan</h4>
                        <p class="text-orange-600 font-bold">৳ ৫৫০</p>
                        <a href="https://wa.me/8801317496029?text=আমি Mini Fan টি অর্ডার করতে চাই" class="inline-block mt-2 text-xs bg-black text-white px-4 py-2 rounded-full">অর্ডার দিন</a>
                    </div>
                </div>

                <div class="bg-white border rounded-xl p-3 flex gap-4 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1614030616194-46960f8546b1?w=200" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-bold">Fast Charger 18W</h4>
                        <p class="text-orange-600 font-bold">৳ ৪৫০</p>
                        <a href="https://wa.me/8801317496029?text=আমি Fast Charger টি অর্ডার করতে চাই" class="inline-block mt-2 text-xs bg-black text-white px-4 py-2 rounded-full">অর্ডার দিন</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loginLogic(method) {
            alert(method + " দিয়ে লগইন সফল হয়েছে!");
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }
    </script>
</body>
</html>
